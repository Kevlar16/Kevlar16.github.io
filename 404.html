<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 &middot; keval patel</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050505">
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png?v=2" type="image/png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Press+Start+2P&family=Yellowtail&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=1795157349">
  <style>
    /* out in the desert, the sign is dark */
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: linear-gradient(#030308 0%, #0a0614 62%, #120a1c 100%);
    }
    .sky { position: fixed; inset: 0; pointer-events: none; }
    .sky i {
      position: absolute;
      width: 2px; height: 2px;
      background: #cfc8e0;
      animation: tw 4s steps(2) infinite;
    }
    @keyframes tw { 50% { opacity: .25; } }

    main.lost {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 560px;
      width: 100%;
      padding: 24px 22px 160px;
    }

    /* the unlit sign: everything reads as off except one bulb */
    .dead { cursor: default; }
    .dead::before { opacity: .12; }
    .dead .body  { fill: #08060c; stroke: #2a1838; }
    .dead .trim  { stroke: #1e1228; filter: none; }
    .dead .post  { fill: #1c1424; }
    .dead .star  { fill: #24210c; filter: none; animation: none; }
    .dead .coins circle { fill: #24210c; filter: none; }
    .dead .coins text   { fill: #0e0a06; }
    .dead .to   { fill: #24210c; filter: none; }
    .dead .core { fill: #221a2a; }
    .bulb { animation: none; fill: #1d1b0a; }
    .bulb.alive { animation: hang-on 3.1s steps(1) infinite; }
    @keyframes hang-on {
      0%, 9%, 13%, 55%, 100% { fill: var(--yellow); filter: drop-shadow(0 0 4px var(--yellow)); }
      8%, 12%, 54%, 58%      { fill: #1d1b0a; filter: none; }
    }

    .lost h1 {
      margin: 36px 0 6px;
      font: 600 13px var(--mono);
      letter-spacing: .12em;
      color: var(--purple);
      text-shadow: 0 0 6px rgba(182, 77, 255, .5);
    }
    .lost h1::before { content: "// "; color: var(--dim); }
    .lost p { color: var(--dim); }

    /* the desert floor */
    .ground {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: 110px;
      z-index: 1;
      pointer-events: none;
    }
    .ground svg { position: absolute; bottom: 0; width: 100%; height: 110px; }
    .weed {
      position: absolute;
      bottom: 14px; left: -60px;
      width: 36px; height: 36px;
      image-rendering: pixelated;
      animation: roll 11s linear infinite;
    }
    @keyframes roll {
      0%   { transform: translateX(0) rotate(0deg); }
      70%  { transform: translateX(calc(100vw + 120px)) rotate(1080deg); }
      100% { transform: translateX(calc(100vw + 120px)) rotate(1080deg); }
    }
    .weed-bob { position: absolute; left: 0; top: 0; width: 100%; height: 100%; animation: bob .55s ease-in-out infinite alternate; }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-9px); } }

    @media (prefers-reduced-motion: reduce) {
      .weed, .weed-bob, .bulb.alive, .sky i { animation: none !important; }
      .weed { display: none; }
    }
  </style>
</head>
<body>
  <div class="sky" id="sky" aria-hidden="true"></div>

  <main class="lost">
    <div class="sign dead" aria-hidden="true">
      <svg viewBox="0 0 600 330">
        <defs>
          <filter id="blur-lg" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
        </defs>
        <g class="topstar">
          <rect x="437" y="40" width="6" height="22" class="post"/>
          <path class="star" d="M440 2 L446 24 L470 30 L446 36 L440 58 L434 36 L410 30 L434 24 Z"/>
        </g>
        <path class="body" d="M110,60 L490,60 L585,180 L490,300 L110,300 L15,180 Z"/>
        <path class="trim" d="M117,70 L483,70 L571,180 L483,290 L117,290 L29,180 Z"/>
        <path id="track" class="track" d="M124,79 L476,79 L559,180 L476,281 L124,281 L41,180 Z"/>
        <g id="bulbs"></g>
        <g class="coins">
          <g transform="translate(132 112)"><circle r="23"/><text y="9">w</text></g>
          <g transform="translate(188 112)"><circle r="23"/><text y="9">e</text></g>
          <g transform="translate(244 112)"><circle r="23"/><text y="9">l</text></g>
          <g transform="translate(300 112)"><circle r="23"/><text y="9">c</text></g>
          <g transform="translate(356 112)"><circle r="23"/><text y="9">o</text></g>
          <g transform="translate(412 112)"><circle r="23"/><text y="9">m</text></g>
          <g transform="translate(468 112)"><circle r="23"/><text y="9">e</text></g>
        </g>
        <text class="to" x="300" y="168">to</text>
        <text class="name core" x="300" y="246">nowhere</text>
      </svg>
    </div>

    <h1>404</h1>
    <p>nothing out here but desert. this page doesn't exist.</p>
    <p><a href="/">back to the strip</a></p>
  </main>

  <div class="ground" aria-hidden="true">
    <svg viewBox="0 0 1200 110" preserveAspectRatio="none">
      <path d="M0 70 L90 46 L160 60 L250 30 L330 58 L420 40 L520 64 L610 36 L700 56 L790 26 L880 52 L980 38 L1070 60 L1200 44 L1200 110 L0 110 Z" fill="#1a1024"/>
      <rect x="0" y="92" width="1200" height="18" fill="#0d0812"/>
    </svg>
    <div class="weed"><canvas class="weed-bob" id="weed" width="12" height="12"></canvas></div>
  </div>

  <script>
    (function () {
      var NS = "http://www.w3.org/2000/svg";

      // bulbs: all dead but one
      var t = document.getElementById("track"), g = document.getElementById("bulbs");
      var L = t.getTotalLength(), n = Math.round(L / 17), alive = Math.floor(n * 0.62);
      for (var i = 0; i < n; i++) {
        var p = t.getPointAtLength(i * L / n), c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", p.x.toFixed(1)); c.setAttribute("cy", p.y.toFixed(1)); c.setAttribute("r", "3.4");
        c.setAttribute("class", i === alive ? "bulb alive" : "bulb");
        g.appendChild(c);
      }

      // stars
      var sky = document.getElementById("sky");
      for (var s = 0; s < 70; s++) {
        var st = document.createElement("i");
        st.style.left = (Math.random() * 100).toFixed(2) + "%";
        st.style.top = (Math.random() * 70).toFixed(2) + "%";
        st.style.animationDelay = (-Math.random() * 4).toFixed(2) + "s";
        st.style.opacity = (0.3 + Math.random() * 0.7).toFixed(2);
        sky.appendChild(st);
      }

      // pixel tumbleweed
      var W = [
        "...bbbbbb...",
        "..b.B..b.b..",
        ".b..b.B...b.",
        "bB.b...b.B.b",
        "b..B.bb..b.b",
        "b.b..B.b...b",
        "b...b..B.b.b",
        "bB.b.bb...Bb",
        ".b...B..b.b.",
        "..b.b..B..b.",
        "...bbbbbb...",
        "............"
      ];
      var ctx = document.getElementById("weed").getContext("2d");
      W.forEach(function (row, y) {
        for (var x = 0; x < row.length; x++) {
          if (row[x] === "b") { ctx.fillStyle = "#8a6a3a"; ctx.fillRect(x, y, 1, 1); }
          if (row[x] === "B") { ctx.fillStyle = "#5a4224"; ctx.fillRect(x, y, 1, 1); }
        }
      });
    })();
  </script>
  <script data-goatcounter="https://kevalpatel.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
